[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-dashboard-backend"
version = "1.0.0"
description = "In-memory schema-driven dashboard API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "starlette==0.52.1"]

[dependency-groups]
dev = ["httpx==0.28.1", "ruff==0.16.7"]

[tool.setuptools]
packages = [
    "backend",
    "backend.src",
    "backend.src.models",
    "backend.src.controllers",
    "backend.src.routes",
    "backend.src.routes.common",
    "backend.tests",
    "backend.tests.unit",
    "backend.tests.unit.controllers",
    "backend.tests.integration",
    "backend.tests.integration.routes",
    "backend.tests.integration.routes.common",
]
package-dir = {"backend" = "."}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
